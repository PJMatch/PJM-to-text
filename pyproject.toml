[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pjm-to-text"
version = "0.1.0"
description = "Translating sign language to text"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "mediapipe",
    "opencv-python",
    "pyyaml>=6.0.3",
    "flashlight-text>=0.0.7",
    "grpcio>=1.78.0",
    "jiwer>=4.0.0",
    "kenlm>=0.3.0",
    "markdown>=3.10.2",
    "protobuf>=7.34.1",
    "rapidfuzz>=3.14.3",
    "tensorboard>=2.20.0",
    "tensorboard-data-server>=0.7.2",
    "torchaudio>=2.10.0",
    "werkzeug>=3.1.6",
    "pytest>=9.0.2",
    "setuptools<82",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
]


[tool.ruff]
target-version = "py310"
line-length = 100

extend-exclude = [
    "models/stgcn",
    "src/stgcn/stgcn_src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

ignore = ["D203", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "google" 

[tool.mypy]
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.uv]
package = false

[[tool.mypy.overrides]]
module = [
    "mediapipe.*",
    "torch.*",
    "cv2.*",
    "matplotlib.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
