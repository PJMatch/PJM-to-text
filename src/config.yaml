training:
  epochs: 40
  batch_size: 8
  learning_rate: 0.0004
  weight_decay: 0.0001
  grad_clip: 1.0
  kl_weight: 0.5
  mirror_data: false
  keep_prob: 0.8
  init_weights: null
  kl_warmup_start: 5
  kl_warmup_end: 10
  deterministic: false

model:
  dropout: 0.2

data:
  dataset: "pjm"
  train_dir: "extracted"
  dev_dir: "extracted"
  annotation_dir: "annotations/pjm_json"
  train_ann: "annotations/PJM.train.txt"
  dev_ann: "annotations/PJM.dev.txt"
  num_workers: 8
  pin_memory: true

optimizer:
  milestones: [20, 35]
  gamma: 0.1

system:
  checkpoint_dir: "checkpoints"
  device: "auto"

logging:
  tensorboard: true
  wandb: false
  log_dir: "runs"
  log_interval: 50
  histogram_interval: 5  
