training:
  epochs: 40
  batch_size: 8
  learning_rate: 0.0004
  weight_decay: 0.0001
  grad_clip: 1.0
  kl_weight: 0.5
  lm_model: "4gram.arpa"
  lexicon: "lexicon.txt"
  mirror_data: true

model:
  dropout: 0.2

data:
  train_dir: "pheonix-dataset_mediapipe/train"
  dev_dir: "pheonix-dataset_mediapipe/dev"
  test_dir: "pheonix-dataset_mediapipe/test"
  train_ann: "annotations/PHOENIX-2014-T.train.corpus.csv"
  dev_ann: "annotations/PHOENIX-2014-T.dev.corpus.csv"
  test_ann: "annotations/PHOENIX-2014-T.test.corpus.csv"
  num_workers: 8
  pin_memory: true

optimizer:
  milestones: [20, 35]
  gamma: 0.1

system:
  checkpoint_dir: "checkpoints"
  device: "auto"

logging:
  tensorboard: true
  wandb: false
  log_interval: 100
  histogram_interval: 100
  gradient_interval: 100
  log_dir: "runs"
