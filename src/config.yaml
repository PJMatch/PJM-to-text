training:
  epochs: 40
  batch_size: 256
  learning_rate: 0.0004
  weight_decay: 0.0001
  grad_clip: 1.0
  deterministic: false

model:
  dropout: 0.2

data:
  dataset: "pjm"
  data_dir: "/pjm/extracted"
  annotation_dir: "/pjm/ann_training"
  train_ann: "annotations/PJM_gloss.train.txt"
  dev_ann: "annotations/PJM_gloss.dev.txt"
  num_workers: 8
  dev_num_workers: 4
  warmup_cache: true
  dev_cache_videos: false
  pin_memory: true
  min_sentences: 4
  train_ratio: 0.75

optimizer:
  milestones: [20, 35]
  gamma: 0.1

system:
  checkpoint_dir: "checkpoints"
  device: "auto"

logging:
  tensorboard: true
  wandb: false
  log_dir: "runs"
  log_interval: 50